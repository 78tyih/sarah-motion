<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sarah component</title>
<style>
/*__FONT__*/
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#F2F0ED;overflow:hidden}
body{width:1440px;height:1440px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/*__ENGINE__*/
(function(){
  var E = window.MorphEngine;
  var q = new URLSearchParams(location.search);
  var eng = E.engines[q.get('engine') || 'basic'];
  var inst = eng.mount(document.getElementById('stage'), {frame:1440, fitPx:1440*0.70});
  window.__setLabel = function(n, d){ E.setLabel(inst, n, d); };
  window.__seek = function(t){ eng.render(inst, t); };
  window.MORPH_READY = true;
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ window.MORPH_READY = true; });
  eng.render(inst, 0);
})();
</script>
</body>
</html>
